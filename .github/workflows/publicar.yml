name: Publicar site e prévia

on:
  push:
    branches: [main, painel-cms]
    paths:
      - "content/**"
      - "templates/**"
      - "assets/**"
      - "scripts/**"
      - "styles.css"
      - "favicon.png"
      - "CNAME"
      - "package.json"
      - "package-lock.json"
      - ".pages.yml"
      - ".github/workflows/publicar.yml"
  workflow_dispatch:
    inputs:
      payload:
        description: Contexto enviado pelo Pages CMS
        required: false
        default: "{}"
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o site oficial
        uses: actions/checkout@v4
        with:
          ref: main
          path: site-oficial

      - name: Baixar a branch de prévia
        uses: actions/checkout@v4
        with:
          ref: painel-cms
          path: site-previa

      - name: Preparar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site-oficial/package-lock.json

      - name: Instalar dependências do site oficial
        working-directory: site-oficial
        run: npm ci

      - name: Gerar e validar o site oficial
        working-directory: site-oficial
        run: npm test

      - name: Instalar dependências da prévia
        working-directory: site-previa
        run: npm ci

      - name: Gerar e validar a prévia
        working-directory: site-previa
        run: npm test

      - name: Adicionar a prévia ao site
        run: node site-previa/scripts/compose-preview.mjs site-oficial/dist site-previa/dist

      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar os arquivos para publicação
        uses: actions/upload-pages-artifact@v5
        with:
          path: site-oficial/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
