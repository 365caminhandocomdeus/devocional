name: Gerar prévia do painel

on:
  push:
    branches: [painel-cms]
    paths:
      - "content/**"
      - "templates/**"
      - "assets/**"
      - "scripts/**"
      - "styles.css"
      - "favicon.png"
      - "CNAME"
      - "package.json"
      - "package-lock.json"
      - ".pages.yml"
      - ".github/workflows/previa-painel.yml"

permissions:
  contents: read

concurrency:
  group: previa-painel-cms
  cancel-in-progress: true

jobs:
  gerar-previa:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar a branch de teste
        uses: actions/checkout@v4

      - name: Preparar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar e validar a prévia
        run: npm test

      - name: Disponibilizar a prévia para download
        uses: actions/upload-artifact@v4
        with:
          name: previa-painel-cms
          path: dist
          if-no-files-found: error
          retention-days: 14
